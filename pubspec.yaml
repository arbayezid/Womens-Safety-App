name: smart_safety
description: Smart Safety - A Smart Women Safety System Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Fonts for the Poppins typeface
  google_fonts: ^6.2.1

  # Cupertino icons (optional, included by default)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Add any local assets here in the future, e.g.:
  # assets:
  #   - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"