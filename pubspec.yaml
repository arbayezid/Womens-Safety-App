name: smart_safety
description: Woman Guard - A Smart Women Safety System Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Fonts for the Poppins typeface
  google_fonts: ^6.2.1

  # Cupertino icons (optional, included by default)
  cupertino_icons: ^1.0.6

  # Real-time Location Extraction
  geolocator: ^13.0.2

  # Reverse Geocoding (Coordinates to human-readable address)
  geocoding: ^2.1.1

  # Direct SMS Dispatch
  telephony: ^0.2.0

  # Audio Player for Emergency Loud Siren
  audioplayers: ^6.1.0

  # Permission Handling
  permission_handler: ^11.3.1

  # Local Persistent Storage
  shared_preferences: ^2.2.2

  # Native Intent Launcher for Phone Calls & SMS
  url_launcher: ^6.2.5

  # Interactive Map Engine (OpenStreetMap tiles)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase Authentication & Google Sign-In
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  # Cloud Firestore & Real-Time Sync
  cloud_firestore: ^5.0.0

  # Firebase Cloud Messaging & In-App Notifications
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # Firebase Storage for Emergency Audio Recordings
  firebase_storage: ^12.0.0

  # Audio Recording for Emergency Quick Action
  record: ^5.1.2
  path_provider: ^2.1.2

  # Background Execution & Foreground Tracking Service
  flutter_background_service: ^5.0.11

  # Battery Level Monitoring for Critical Battery Alerts
  battery_plus: ^6.2.1

  # Cryptographic Hashing for Salted SHA-256 PIN Security
  crypto: ^3.0.6

  # Accelerometer Sensor for Fall Detection
  sensors_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true